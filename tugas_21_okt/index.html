
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Nilai Siswa</title>
</head>
<body>
    <script>
        let namaSiswa = ["ucup", "otong", "emil", "mario"];
        let nilai = [90, 80, 70, 60];

         namaSiswa.push("joko");
        nilai.push(85);

       
        namaSiswa.splice(1, 1);
        nilai.splice(1, 1);

       
        let rata2 = nilai.reduce((a, b) => a + b, 0) / nilai.length;

        document.write("<h2>Aplikasi Pengolahan Nilai Siswa</h2>");
        document.write("<table border='1' cellpadding='5'>");
        document.write("<tr><th>Nama</th><th>Nilai</th><th>Status</th></tr>");

      
        let siswaLulus = nilai.filter(n => n >= 75);

        
        let urutNilai = [...nilai].sort((a, b) => b - a);

   
        for (let i = 0; i < namaSiswa.length; i++) {
            let status = nilai[i] >= 75 ? "Lulus" : "Tidak Lulus";

            document.write("<tr>");
            document.write("<td>" + namaSiswa[i] + "</td>");
            document.write("<td>" + nilai[i] + "</td>");
            document.write("<td>" + status + "</td>");
            document.write("</tr>");
        }

        document.write("</table>");
        document.write("<p>Rata-rata: " + rata2 + "</p>");
        document.write("<p>Siswa dengan nilai minimal 75: " + siswaLulus.length + " orang</p>");
        document.write("<p>Nilai tertinggi ke terendah: " + urutNilai + "</p>");

    </script>
</body>
</html>
