<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>operator komparasi</title>
</head>
<body>
    <h2>ini latihan boolean</h2>
    <style>
        h2 {
            color: blue;
        }
    </style>
    
    <script>
    let Boolean = 10 > 5;
    document.write(Boolean + "<br>");

    let databoolean = 10 < 5;
    document.write(databoolean + "<br>");

    let databoolean2 = 10 == "10";
    document.write(databoolean2 + "<br>");
    
    let data1 = 4==="4";
    document.write(data1 + "<br>");

    let data2 = 5!=="5";
    document.write(data2 + "<br>");


    </script>
</body>
</html>
