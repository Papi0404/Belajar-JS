<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>latihan 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

    <div class="container mt-5">
        <div class="row text-center mb-3">
            <div class="col">
                <h2>Latihan #1 JavaScript</h2>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="input-group mb-3">
                    <input type="text" class="form-control" placeholder="Masukkan Nama Anda" id="namaInput">
                </div>
                <div class="input-group mb-3">
                    <input type="text" class="form-control" placeholder="Masukkan Motto Anda" id="mottoInput">
                </div>
                
                <div class="d-grid gap-2 mt-3">
                    <button type="button" class="btn btn-primary" id="button_merge">Submit</button>
                </div>

                <div class="row justify-content-center mt-3 text-center">
                    <div class="col">
                        <span id="namaOutput" class="d-block"></span>
                        <span id="mottoOutput" class="d-block"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script> 
    <!-- Script lokal Anda -->
    <script src="script.js"></script>
</body>
</html>
