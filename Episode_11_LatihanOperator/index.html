<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
rel="stylesheet">

<style>
    body {
        background: linear-gradient(135deg, #e8f5e9, #f1f8e9);
        min-height: 100vh;
        font-family: Arial, sans-serif;
    }

    .calculator-card {
        max-width: 850px;
        margin: 100px auto;
        padding: 40px;
        background: white;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    h1 {
        font-weight: 700;
        color: #198754;
        margin-bottom: 10px;
    }

    .subtitle {
        text-align: center;
        color: #6c757d;
        margin-bottom: 35px;
    }

    .form-control,
    .form-select {
        height: 50px;
        border-radius: 10px;
        border: 1px solid #ced4da;
    }

    .form-control:focus,
    .form-select:focus {
        border-color: #198754;
        box-shadow: 0 0 0 0.2rem rgba(25, 135, 84, 0.15);
    }

    .btn-primary {
        width: 100%;
        height: 50px;
        border-radius: 10px;
        background-color: #198754;
        border: none;
        font-weight: 600;
    }

    .btn-primary:hover {
        background-color: #157347;
    }

    .result-box {
        margin-top: 25px;
        padding: 15px;
        background-color: #e8f5e9;
        border-radius: 10px;
        text-align: center;
        font-size: 20px;
        font-weight: 600;
        color: #198754;
    }
</style>
```

</head>

<body>

```
<div class="container">
    <div class="calculator-card">

        <h1 class="text-center">
            Episode #11
        </h1>

        <p class="subtitle">
            Latihan Operator Aritmatika
        </p>

        <div class="row g-3 justify-content-center">

            <div class="col-md-3">
                <input 
                    id="aritmatika1" 
                    type="number" 
                    class="form-control" 
                    placeholder="Angka 1">
            </div>

            <div class="col-md-2">
                <select id="operatorAritmatika" class="form-select">
                    <option selected disabled>Pilih</option>
                    <option value="+">+</option>
                    <option value="-">−</option>
                    <option value="/">÷</option>
                    <option value="%">%</option>
                    <option value="*">×</option>
                </select>
            </div>

            <div class="col-md-3">
                <input 
                    id="aritmatika2" 
                    type="number" 
                    class="form-control" 
                    placeholder="Angka 2">
            </div>

            <div class="col-md-4">
                <button 
                    type="button" 
                    class="btn btn-primary" 
                    id="buttonAritmatika">
                    Hasil Hitung
                </button>
            </div>

        </div>

        <div class="result-box">
            Hasil: <span id="hasilAritmatika">-</span>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script src="script.js"></script>
```

</body>
</html>
