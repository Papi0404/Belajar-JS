<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
    rel="stylesheet" 
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
    crossorigin="anonymous">
</head>
<body>
       <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
rel="stylesheet">

<style>
    body {
        background: linear-gradient(135deg, #e8f5e9, #f1f8e9);
        min-height: 100vh;
        font-family: Arial, sans-serif;
    }

    .calculator-card {
        max-width: 850px;
        margin: 100px auto;
        padding: 40px;
        background: white;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    h1 {
        font-weight: 700;
        color: #198754;
        margin-bottom: 10px;
    }

    .subtitle {
        text-align: center;
        color: #6c757d;
        margin-bottom: 35px;
    }

    .form-control,
    .form-select {
        height: 50px;
        border-radius: 10px;
        border: 1px solid #ced4da;
    }

    .form-control:focus,
    .form-select:focus {
        border-color: #198754;
        box-shadow: 0 0 0 0.2rem rgba(25, 135, 84, 0.15);
    }

    .btn-primary {
        width: 100%;
        height: 50px;
        border-radius: 10px;
        background-color: #198754;
        border: none;
        font-weight: 600;
    }

    .btn-primary:hover {
        background-color: #157347;
    }

    .result-box {
        margin-top: 25px;
        padding: 15px;
        background-color: #e8f5e9;
        border-radius: 10px;
        text-align: center;
        font-size: 20px;
        font-weight: 600;
        color: #198754;
    }
</style>

    <div class="class container">
       <div class="row my-5">
<h1 class ="text-center"> Episode #11 Latihan Operator</h1>
</div>
    </div>
    <div class="container">
    <div class="row justify-content-center">
        <div class="col-2">
        <div class="input-group">
            <input id ="aritmatika1" type="text" class="form-control" placeholder="Angka 1" aria-label="Angka1">
        </div>

    </div>
    <div class="col-2">
<div class="input-group">
    <select  id="operatorAritmatika"
    class="form-select">
 <option selected>Pilih Operator</option>
<option value="+">+</option>
<option value="-">-</option>
<option value="/">/</option>
<option value="%">%</option>
<option value="*">X</option>


</select>
</div>
    </div>
    <div class="col-2">
<div class="input-group">
            <input id ="aritmatika2" type="number" class="form-control" placeholder="Angka 2" aria-label="Angka2">
        </div>
    </div>
    <div class="col-2">
<div class="input-group">
    <button type="button" class="btn btn primary" 
    id="buttonAritmatika">Hasil Hitung
    </button>
</div>
<span class="mx-4"
id="hasilAritmatika">Hasil</span>
    </div>
    
</div>
    </div>
    
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
