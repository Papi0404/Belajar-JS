<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Operator Aritmatika</h2>
    <script>
        let a = 10 + 5;
        let b = 20 - 8;
        let c = 4 * 6;
        let d = 12 / 3;
        let e = 15 % 4;
        let f = 2 ** 3;
        console.log("Hasil Penjumlahan: " + a);
        console.log("Hasil Pengurangan: " + b);
        console.log("Hasil Perkalian: " + c);
        console.log("Hasil Pembagian: " + d);
        console.log("Hasil Modulus: " + e);
        console.log("Hasil Perpangkatan: " + f);
    </script>
</body>
</html>
